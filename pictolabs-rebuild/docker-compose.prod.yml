services:
  postgres:
    image: postgres:16-alpine
    container_name: pictolabs-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pictolabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pictolabs_secure_prod_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pictolabs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pictolabs} -d ${POSTGRES_DB:-pictolabs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pictolabs-network

  redis:
    image: redis:7-alpine
    container_name: pictolabs-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pictolabs-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pictolabs-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pictolabs}:${POSTGRES_PASSWORD:-pictolabs_secure_prod_2026}@postgres:5432/${POSTGRES_DB:-pictolabs}?schema=public
      JWT_SECRET: ${JWT_SECRET:-pictolabs_super_secret_jwt_key_prod_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-true}
      PAYMENT_GATEWAY_PROVIDER: MIDTRANS
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      MEDIA_CLOUD_RETENTION_DAYS: ${MEDIA_CLOUD_RETENTION_DAYS:-30}
      MEDIA_LOCAL_RETENTION_DAYS: ${MEDIA_LOCAL_RETENTION_DAYS:-7}
    volumes:
      - backend_uploads:/app/apps/backend/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pictolabs-network

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: https://api.pictolabs.id
    container_name: pictolabs-dashboard
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pictolabs-network

  nginx:
    image: nginx:alpine
    container_name: pictolabs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/certbot-challenge:/var/www/certbot:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - pictolabs-network

  certbot:
    image: certbot/certbot:latest
    container_name: pictolabs-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/certbot-challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - pictolabs-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  pictolabs-network:
    driver: bridge
